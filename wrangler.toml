name = "bitchord-addon"
main = "src/index.ts"
compatibility_date = "2026-10-29"

# PATH_SECRET and TORBOX_KEY are secrets: .dev.vars locally, `wrangler secret put` deployed.

[[d1_databases]]
binding = "DB"
database_name = "bitchord-addon"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

[triggers]
crons = ["*/2 * * * *"]

# Enabled on the dashboard already; stated here so a deploy does not turn it off.
[observability]
enabled = true
